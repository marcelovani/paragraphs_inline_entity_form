langcode: en
status: true
dependencies:
  config:
    - filter.format.paragraphs_ief_example
  module:
    - ckeditor5
format: paragraphs_ief_example
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - bold
      - italic
      - paragraphs_inline_entity_form
      - link
      - alignment
      - drupalInsertImage
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_imageResize:
      allow_resize: true
image_upload:
  status: false
  scheme: public
  directory: inline-images
  max_size: ''
  max_dimensions:
    width: 0
    height: 0
